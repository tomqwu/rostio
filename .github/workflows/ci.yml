name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signupflow
          POSTGRES_PASSWORD: signupflow
          POSTGRES_DB: signupflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signupflow -d signupflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Black (format check)
        run: poetry run black --check api tests

      - name: Ruff (lint)
        run: poetry run ruff check api tests

      - name: mypy strict (api/utils, api/core, api/schemas)
        # PR 4.7 made api/utils strict; PR 4.8 added api/core (solver domain)
        # and api/schemas (Pydantic contract layer). Failures here block
        # merges. When you add a new file to any of these packages it must
        # satisfy strict mypy.
        run: poetry run mypy api/utils api/core api/schemas

      - name: mypy (type check, advisory)
        # mypy is advisory for the rest of api/ while we work down the legacy
        # backlog (751 errors at last count). Track remediation in
        # docs/PHASE_2.md before flipping this to required.
        continue-on-error: true
        run: poetry run mypy api

      - name: Unit tests
        run: poetry run pytest tests/unit/ -v --tb=short

      - name: API tests
        run: poetry run pytest tests/api/ -v --tb=short

      - name: CLI tests
        run: poetry run pytest tests/cli/ -v --tb=short

      - name: OpenAPI contract snapshot
        run: poetry run pytest tests/contract/ -v --tb=short

      - name: Web tests
        # In-process FastAPI TestClient (no browser) — the cookie/HTMX
        # web app suite grown across the full-feature marathon.
        run: poetry run pytest tests/web/ -v --tb=short

      - name: Integration tests
        # Sprint 4 PR 4.6a brought back the api_server fixture and a smoke
        # test. PR 4.6b is reviving the previously-failing files; until then
        # they're skip-marked at module scope.
        run: poetry run pytest tests/integration/ -v --tb=short

      - name: Alembic upgrade head (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg2://signupflow:signupflow@localhost:5432/signupflow_ci
        run: poetry run alembic upgrade head

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Blocking lane: real uvicorn + headless Chromium drive the full web
    # workflows. Deterministic (throwaway SQLite per run, no external
    # network, sandbox env). The merge protocol won't merge if this is red.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Install Playwright + Chromium
        # playwright is e2e-only; installed here (not in poetry.lock) so
        # the main dependency graph stays lean.
        run: |
          poetry run pip install "playwright==1.60.0"
          poetry run playwright install --with-deps chromium

      - name: Run e2e suite
        run: poetry run pytest tests/e2e/ -v --tb=short
